[project]
name = "fleetline-sim"
version = "0.1.0"
description = "Fleetline demand replay: download NYC trips, build a replay day, emit timed events"
readme = "README.md"
authors = [
    { name = "Avneet Singh Nijjer", email = "avneetnijjer06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "h3>=4.5.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "typer>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
fleetline-sim = "fleetline_sim.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
