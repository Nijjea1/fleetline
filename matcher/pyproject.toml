[project]
name = "fleetline-matcher"
version = "0.1.0"
description = "Fleetline E4: rider-car assignment solvers (SciPy, OR-Tools, Go, CUDA) on instances built from real NYC trips"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "ortools>=9.15.6755",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fleetline_matcher"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
# Only for building the optional GPU solver (matcher/cuda/build.sh).
cuda = [
    "pybind11>=3",
]
