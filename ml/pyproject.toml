[project]
name = "fleetline-ml"
version = "0.1.0"
description = "Fleetline ML: residual ETA model over OSRM (PyTorch -> ONNX -> TensorRT) and robotaxi motion prediction"
readme = "README.md"
authors = [
    { name = "Avneet Singh Nijjer", email = "avneetnijjer06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "typer>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
fleetline-ml = "fleetline_ml.cli:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
